[project]
name = "evi"
version = "0.1.0"
description = "Eroded Volume Indicator (EVI) revisited: storm erosion at Truc Vert, 2017 method audited and extended"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
