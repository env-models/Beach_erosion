[project]
name = "evi"
version = "0.1.0"
description = "Eroded Volume Indicator (EVI) revisited: storm erosion at Truc Vert, 2017 method audited and extended"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Only test_*.py is collected; tests/review_*.py are reviewer checks run explicitly
# (e.g. tests/review_time_alignment.py fails on purpose, see reports/R_review_A.md F1).
python_files = ["test_*.py"]
